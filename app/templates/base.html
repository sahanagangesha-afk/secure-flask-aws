<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fraud Detection System</title>
<style>
body{font-family:system-ui,sans-serif;margin:0;background:#f4f6f8;color:#1f2933}
nav{background:#102a43;color:#fff;padding:12px 24px;display:flex;gap:16px;align-items:center}
nav a,nav button{color:#fff;background:none;border:0;cursor:pointer;font-size:1rem;text-decoration:none}
nav .sp{flex:1}main{max-width:1000px;margin:24px auto;padding:0 16px}
.card{background:#fff;border-radius:8px;padding:16px;margin-bottom:16px;box-shadow:0 1px 3px #0002}
table{width:100%;border-collapse:collapse;font-size:.9rem}th,td{text-align:left;padding:6px;border-bottom:1px solid #e4e7eb}
.flag{color:#b91c1c;font-weight:600}.msg{background:#fff8c5;padding:8px 12px;border-radius:6px;margin-bottom:12px}
input,button.primary{padding:8px;margin:4px 4px 4px 0}button.primary{background:#2563eb;color:#fff;border:0;border-radius:4px}
.stats{display:flex;gap:12px;flex-wrap:wrap}.stats div{flex:1;min-width:140px;text-align:center}.stats b{font-size:1.6rem;display:block}
</style></head><body>
<nav><strong>Fraud Detection</strong>
{% if current_user %}<a href="{{ url_for('main.dashboard') }}">Dashboard</a>
{% if current_user.is_admin %}<a href="{{ url_for('main.admin') }}">Admin</a>{% endif %}
<span class="sp"></span><span>{{ current_user.username }}</span>
<form method="post" action="{{ url_for('main.logout') }}"><input type="hidden" name="_csrf" value="{{ csrf_token() }}"><button>Logout</button></form>
{% endif %}</nav>
<main>{% for m in get_flashed_messages() %}<div class="msg">{{ m }}</div>{% endfor %}{% block content %}{% endblock %}</main>
</body></html>
