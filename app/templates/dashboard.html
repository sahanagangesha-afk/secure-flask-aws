{% extends "base.html" %}{% block content %}
<div class="card"><h3>New transaction</h3>
<form method="post" action="{{ url_for('main.add_transaction') }}"><input type="hidden" name="_csrf" value="{{ csrf_token() }}">
<input name="account" placeholder="Account" required><input name="amount" type="number" step="0.01" placeholder="Amount" required>
<input name="country" maxlength="2" placeholder="Country (IN)" required><input name="merchant" placeholder="Merchant" required>
<button class="primary">Score &amp; save</button></form></div>
<div class="card"><h3>Recent transactions</h3>
<table><tr><th>ID</th><th>Account</th><th>Amount</th><th>Country</th><th>Merchant</th><th>Risk</th><th>Reasons</th></tr>
{% for t in txns %}<tr><td>{{ t.id }}</td><td>{{ t.account }}</td><td>{{ t.amount }}</td><td>{{ t.country }}</td><td>{{ t.merchant }}</td>
<td class="{{ 'flag' if t.flagged }}">{{ t.risk_score }}</td><td>{{ t.reasons }}</td></tr>{% endfor %}</table></div>
{% endblock %}
