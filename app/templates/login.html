{% extends "base.html" %}{% block content %}
<div class="card" style="max-width:360px;margin:60px auto"><h2>Sign in</h2>
<form method="post"><input type="hidden" name="_csrf" value="{{ csrf_token() }}">
<input name="username" placeholder="Username" required autofocus><br>
<input name="password" type="password" placeholder="Password" required><br>
<button class="primary">Login</button></form></div>{% endblock %}
